services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.hunyuan3d-paint
    image: comfyui-docker:unified-paint
    container_name: comfyui
    restart: unless-stopped

    ports:
      - "8188:8188"

    gpus: all

    environment:
      - TLS_KEYFILE=/app/ComfyUI/certs/key.pem
      - TLS_CERTFILE=/app/ComfyUI/certs/cert.pem
      # - CUDA_VISIBLE_DEVICES=0

    volumes:
      # Keep host custom-node sources outside the container node directory so
      # the entrypoint can add the private Paint wrapper alongside them.
      - ${COMFYUI_DATA_DIR:-./data}/custom_nodes:/mnt/host-custom-nodes
      - ${COMFYUI_DATA_DIR:-./data}/user:/app/ComfyUI/user
      - ${COMFYUI_DATA_DIR:-./data}/models:/app/ComfyUI/models
      - ${COMFYUI_DATA_DIR:-./data}/input:/app/ComfyUI/input
      - ${COMFYUI_DATA_DIR:-./data}/output:/app/ComfyUI/output
      - ${COMFYUI_DATA_DIR:-./data}/__manager:/app/ComfyUI/user/__manager
      - ./certs:/app/ComfyUI/certs

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
