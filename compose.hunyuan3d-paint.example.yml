services:
  comfyui-hunyuan3d-paint:
    build:
      context: .
      dockerfile: Dockerfile.hunyuan3d-paint
    image: comfyui-docker:hunyuan3d-paint
    container_name: comfyui-hunyuan3d-paint
    ports:
      - "8189:8188"
    gpus: all
    environment:
      - TZ=Asia/Tokyo
      - TLS_KEYFILE=/app/ComfyUI/certs/key.pem
      - TLS_CERTFILE=/app/ComfyUI/certs/cert.pem
    volumes:
      - ${COMFYUI_DATA_DIR:-./data}/custom_nodes:/mnt/host-custom-nodes
      # Keep the ComfyUI SQLite database separate from the normal service.
      - ./data/user:/app/ComfyUI/user
      - ${COMFYUI_DATA_DIR:-./data}/models:/app/ComfyUI/models
      - ${COMFYUI_DATA_DIR:-./data}/input:/app/ComfyUI/input
      - ${COMFYUI_DATA_DIR:-./data}/output:/app/ComfyUI/output
      - ./data/__manager:/app/ComfyUI/user/__manager
      - ./certs:/app/ComfyUI/certs
